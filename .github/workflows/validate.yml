name: Validate datasets
on:
  push:
    branches: [feat/faction-technology-trees]
  pull_request:
jobs:
  validate-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run test:validation-text
      - run: npm run validate
      - run: npm run test:technologies
